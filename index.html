<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Infinite Pixel Jumper Deluxe</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <button id="pauseBtn" class="top-btn">⏸</button>
    <button id="soundBtn" class="top-btn">🔊</button>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-display">
                <div id="scoreEl">0m</div>
                <div id="comboEl" class="combo-text hidden">COMBO x2 !</div>
            </div>
            <div class="money-display"><span class="coin-icon"></span><span id="moneyEl">0</span></div>
        </div>

        <div id="menuScreen" class="screen">
            <div class="title">LEHMANN<br>JUMP</div>
            <button class="button" id="startBtn">JOUER</button>
            <button class="button" id="settingsBtn">PARAMETRES</button>
            <div class="instructions">
                INCLINEZ LE TELEPHONE OU TOUCHEZ LES BORDS POUR BOUGER.<br><br>EVITEZ LES PIQUES ROUGES.<br><br>RECOLTEZ LES PIECES POUR DES COMBOS !
            </div>
            <div class="stats" id="highScoreMenu">MEILLEUR SCORE : 0M</div>
        </div>

        <div id="settingsScreen" class="screen hidden">
            <div class="title params-title">PARAMETRES</div>
            <div class="stat-row">
                <label class="gyro-label">
                    <input type="checkbox" id="gyroToggle">
                    ACTIVER GYROSCOPE
                </label>
            </div>
            <div class="instructions instructions-settings">
                (DESACTIVER POUR JOUER UNIQUEMENT EN TOUCHANT L'ECRAN)
            </div>
            <button class="button" id="closeSettingsBtn">RETOUR</button>
        </div>

        <div id="pauseScreen" class="screen hidden">
            <div class="title pause-title">PAUSE</div>
            <button class="button" id="resumeBtn">REPRENDRE</button>
        </div>

        <div id="gameOverScreen" class="screen hidden">
            <div class="game-over-title">PARTIE TERMINEE</div>
            <div class="stat-row">ALTITUDE : <span id="finalScore" class="highlight">0</span>m</div>
            <div class="stat-row final-stat-row">PIECES : <span id="finalCoins" class="highlight">0</span>
            </div>
            <button class="button" id="restartBtn">REESSAYER</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>

</html>
