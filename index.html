<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Infinite Pixel Jumper Deluxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <button id="pauseBtn" class="top-btn" style="right: 20px; display: none;">⏸</button>
    <button id="soundBtn" class="top-btn" style="right: 70px;">🔊</button>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-display">
                <div id="scoreEl">0m</div>
                <div id="comboEl" class="combo-text hidden">COMBO x2 !</div>
            </div>
            <div class="money-display"><span class="coin-icon"></span><span id="moneyEl">0</span></div>
        </div>

        <div id="menuScreen" class="screen">
            <div class="title">PIXEL<br>JUMPER</div>
            <button class="button" id="startBtn">JOUER</button>
            <button class="button" id="settingsBtn" style="font-size: 14px; padding: 10px 20px;">PARAMÈTRES</button>
            <div class="instructions">
                INCLINEZ LE TÉLÉPHONE OU TOUCHEZ LES BORDS POUR BOUGER.<br><br>ÉVITEZ LES PIQUES ROUGES.<br><br>RÉCOLTEZ LES PIÈCES POUR DES COMBOS !
            </div>
            <div class="stats" id="highScoreMenu">MEILLEUR SCORE : 0M</div>
        </div>

        <div id="settingsScreen" class="screen hidden">
            <div class="title" style="font-size: 24px; color: #fff;">PARAMÈTRES</div>
            <div class="stat-row">
                <label style="cursor:pointer; display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="gyroToggle" style="width:24px; height:24px;">
                    ACTIVER GYROSCOPE
                </label>
            </div>
            <div class="instructions" style="margin-top:20px;">
                (DÉSACTIVER POUR JOUER UNIQUEMENT EN TOUCHANT L'ÉCRAN)
            </div>
            <button class="button" id="closeSettingsBtn" style="margin-top: 40px;">RETOUR</button>
        </div>

        <div id="pauseScreen" class="screen hidden">
            <div class="title" style="color: #fff;">PAUSE</div>
            <button class="button" id="resumeBtn">REPRENDRE</button>
        </div>

        <div id="gameOverScreen" class="screen hidden">
            <div class="game-over-title">PARTIE TERMINÉE</div>
            <div class="stat-row">ALTITUDE : <span id="finalScore" class="highlight">0</span>m</div>
            <div class="stat-row" style="margin-bottom: 40px;">PIÈCES : <span id="finalCoins" class="highlight">0</span>
            </div>
            <button class="button" id="restartBtn">RÉESSAYER</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
